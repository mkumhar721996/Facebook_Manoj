<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up</title>
<link rel="stylesheet" href="/design/tokens.css" />
<link rel="stylesheet" href="/design/prototype-utils.css" />
<style>
  .page {
    max-width: 420px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-4);
  }
  .field-error {
    font-size: var(--font-size-xs);
    color: var(--color-danger);
    min-height: 1em;
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="card-header">Create your account</div>
    <div class="card-body u-stack u-gap-4">
      <form id="signup-form" novalidate>
        <div class="u-stack u-gap-4">
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" />
            <span class="field-error" data-error-for="email"></span>
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" autocomplete="new-password" />
            <span class="helper-text">At least 8 characters, with a letter and a number.</span>
            <span class="field-error" data-error-for="password"></span>
          </div>
          <button class="btn btn-primary" type="submit">Sign up</button>
          <p class="text-sm" data-form-message></p>
        </div>
      </form>
      <p class="text-sm text-muted">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
</div>
<script type="module">
  import { attachSignupForm } from "/src/signupForm.js";
  attachSignupForm(document.getElementById("signup-form"), window.fetch.bind(window));
</script>
</body>
</html>
